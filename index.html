// 合并几何体（保留索引）；vc=true 时把材质颜色写进顶点色
function mergeGeos(list,vc){let nv=0,ni=0;const parts=list.map(([o,col,lb])=>{const geo=o.geometry.clone();geo.applyMatrix4(o.matrixWorld);
  const n=geo.attributes.position.count;nv+=n;ni+=geo.index?geo.index.count:n;return [geo,col,lb]});const LB=vc?new Float32Array(nv*4):null;
 const P=new Float32Array(nv*3),N=new Float32Array(nv*3),U=new Float32Array(nv*2),C=vc?new Float32Array(nv*3):null,I=new Uint32Array(ni);let k=0,j=0;
 for(const [geo,col,lb] of parts){const n=geo.attributes.position.count;if(LB&&lb)for(let i=0;i<n;i++)LB.set(lb,(k+i)*4);P.set(geo.attributes.position.array,k*3);if(geo.attributes.normal)N.set(geo.attributes.normal.array,k*3);
  if(geo.attributes.uv)U.set(geo.attributes.uv.array,k*2);if(C)for(let i=0;i<n;i++){C[(k+i)*3]=col.r;C[(k+i)*3+1]=col.g;C[(k+i)*3+2]=col.b}
  if(geo.index){const ix=geo.index.array;for(let i=0;i<ix.length;i++)I[j++]=ix[i]+k}else for(let i=0;i<n;i++)I[j++]=i+k;k+=n;geo.dispose()}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(P,3));geo.setAttribute('normal',new THREE.BufferAttribute(N,3));geo.setAttribute('uv',new THREE.BufferAttribute(U,2));

function mergeGroup(g){g.updateMatrixWorld(true);const by=new Map();

const isSep=m=>m.transparent||m.map||m.isShaderMaterial||(m.emissive&&m.emissiveIntensity>0&&(m.emissive.r+m.emissive.g+m.emissive.b)>.05);
function mergeVC(g){g.updateMatrixWorld(true);const by=new Map([['vc',[]]]);
 g.traverse(o=>{if(!o.isMesh)return;const m=o.material,k=isSep(m)?m:'vc';if(!by.has(k))by.set(k,[]);
  // 关节标记：把枢轴从父节点空间转到模型空间
  let lb=null;if(o.userData.limb){const L=o.userData.limb,p=new V(L[0],L[1],L[2]).applyMatrix4(o.parent.matrixWorld);lb=[p.x,p.y,p.z,L[3]]}

 for(let az=-3;az<=1;az+=.5)for(let h=6;h<=16;h+=.25)for(let d=4;d<=14;d+=.25){at.set(0,0,az);CAM.position.set(0,h,d);CAM.lookAt(at);CAM.updateMatrixWorld();

  const e=(b-yb)**2*4+(xw-1)**2+(t>.62?(t-.62)**2*6:0)+(t<.35?(.35-t)**2*6:0);if(e<be){be=e;best=[h,d,az]}}
 CAMHOME.pos.set(0,best[0],best[1]);CAMHOME.at.set(0,0,best[2]);CAM.position.copy(CAMHOME.pos);CAM.lookAt(CAMHOME.at)}

// ================= 音效：WebAudio 合成，首次触摸解锁 =================
const SFX={ctx:null,on:true,master:null};
function audioUnlock(){if(SFX.ctx){if(SFX.ctx.state=='suspended')SFX.ctx.resume();return}
 try{SFX.ctx=new (window.AudioContext||window.webkitAudioContext)();SFX.master=SFX.ctx.createGain();SFX.master.gain.value=.5;SFX.master.connect(SFX.ctx.destination)}catch(e){}if(typeof musAttach=='function')musAttach()}
function tone(f,d,type='sine',v=.3,f2,delay=0){const a=SFX.ctx;if(!a||!SFX.on)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(SFX.master);o.start(t);o.stop(t+d+.02)}
let _nb;function nz(d,v=.3,freq=1200,q=1,delay=0){const a=SFX.ctx;if(!a||!SFX.on)return;if(!_nb){_nb=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=_nb.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
 const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=_nb;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 s.connect(f);f.connect(g);g.connect(SFX.master);s.start(t);s.stop(t+d+.02)}
const SND={
 splat(c=0){nz(.12,.35,600+c*30,1.5);tone(180+Math.min(c,40)*12,.09,'triangle',.25,90)},
 swipe(){nz(.18,.18,3000,.7)},
 combo(n){const k=[0,2,4,5,7,9,11,12][n%8]+12*Math.min(2,n/8|0);tone(440*Math.pow(2,k/12),.12,'square',.08)},

// ---- music.js ----
// ================= 音乐引擎：程序化编曲 + 预排程序列器 + 歌曲时钟 =================
// 歌曲时钟以 AudioContext.currentTime 为准，画面和判定都读 songTime()，保证音画同步
const MUS={on:false,start:0,bpm:100,spb:.6,song:null,nextStep:0,lowpass:null,comp:null,bus:null,padBus:null,fever:false,lp:18000,paused:false,fallback:0};
function musInit(){const a=SFX.ctx;if(!a||MUS.bus)return;
 MUS.comp=a.createDynamicsCompressor();MUS.comp.threshold.value=-14;MUS.comp.ratio.value=3;
 MUS.lowpass=a.createBiquadFilter();MUS.lowpass.type='lowpass';MUS.lowpass.frequency.value=18000;MUS.lowpass.Q.value=.7;
 MUS.bus=a.createGain();MUS.bus.gain.value=.9;MUS.bus.connect(MUS.lowpass);MUS.lowpass.connect(MUS.comp);MUS.comp.connect(SFX.master)}
const midiF=m=>440*Math.pow(2,(m-69)/12);
// 当前歌曲拍数（可为负：开拍前）
function songBeat(){return songTime()/MUS.spb}
function songTime(){if(!MUS.on)return MUS.fallback;const a=SFX.ctx;if(!a)return MUS.fallback;return a.currentTime-MUS.start-(a.outputLatency||a.baseLatency||0)}
function musStart(song,lead=0){MUS.song=song;MUS.bpm=song.bpm;MUS.spb=60/song.bpm;MUS.nextStep=0;MUS.fever=false;MUS.paused=false;
 const a=SFX.ctx;if(!a){MUS.on=false;MUS.fallback=-lead;return}musInit();if(a.state=='suspended')a.resume();MUS.start=a.currentTime+.08+lead;MUS.on=true}
// 首次触摸解锁音频：接着帧时钟继续放，拍子不跳
function musAttach(){const a=SFX.ctx;if(!a||MUS.on||!MUS.song||MUS.paused)return;musInit();const ft=MUS.fallback;MUS.start=a.currentTime+.05-ft;MUS.nextStep=Math.max(0,Math.ceil((ft+.05)/(MUS.spb/4)));MUS.on=true}
function musStop(){MUS.on=false;MUS.song=null}
function musPause(p){const a=SFX.ctx;if(!a)return;MUS.paused=p;if(p)a.suspend();else a.resume()}
// 无音频时用帧时间推进时钟
function musTick(dt){if(!MUS.on&&MUS.song&&!MUS.paused)MUS.fallback+=dt;
 if(MUS.lowpass){const k=MUS.lowpass.frequency;k.value+=(MUS.lp-k.value)*.08}
 if(MUS.on&&MUS.song)musSchedule()}

// ---------- 乐器 ----------
function env(g,t,a,peak,d,sus=0){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,.0008),t+a+d)}
function osc(type,f,t,dur,peak,out,a=.005,d){const A=SFX.ctx,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);env(g,t,a,peak,d||dur);o.connect(g);g.connect(out);o.start(t);o.stop(t+a+(d||dur)+.05);return o}
const INS={
 kick(t,v=1){const A=SFX.ctx,o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);env(g,t,.002,.9*v,.28);o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+.35)},
 snare(t,v=1){noiseAt(t,.16,.45*v,1900,.8,'bandpass');osc('triangle',190,t,.1,.25*v,MUS.bus)},
 clap(t,v=1){for(let i=0;i<3;i++)noiseAt(t+i*.012,.09,.28*v,1400,1.2,'bandpass')},
 hat(t,v=1,open){noiseAt(t,open?.18:.035,.14*v,8000,.5,'highpass')},
 tom(t,f,v=1){const A=SFX.ctx,o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+.22);env(g,t,.003,.5*v,.25);o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+.3)},
 crash(t){noiseAt(t,1.1,.2,6000,.4,'highpass')},
 bass(t,m,d){const A=SFX.ctx,o=A.createOscillator(),f=A.createBiquadFilter(),g=A.createGain();o.type='sawtooth';o.frequency.setValueAtTime(midiF(m),t);f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(220,t+d);
  env(g,t,.008,.32,d);o.connect(f);f.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+d+.08)},
 pad(t,ms,d){const A=SFX.ctx,f=A.createBiquadFilter(),g=A.createGain();f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.25);g.gain.setValueAtTime(.05,t+d-.2);g.gain.linearRampToValueAtTime(0,t+d);
  f.connect(g);g.connect(MUS.bus);for(const m of ms)for(const dt of[-6,6]){const o=A.createOscillator();o.type='sawtooth';o.frequency.value=midiF(m);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+d+.05)}},

 // 旋律：命中时才响（拨弦/木琴音色）
 lead(m,v=1,t){const A=SFX.ctx;if(!A||!SFX.on||!MUS.bus)return;t=t||A.currentTime;const f=midiF(m);osc('triangle',f,t,.5,.32*v,MUS.bus,.003,.55);osc('sine',f*2,t,.25,.12*v,MUS.bus,.002,.25);osc('sine',f*4.01,t,.08,.05*v,MUS.bus,.001,.08)},
 // 长按：持续音，返回 stop()
 hold(m){const A=SFX.ctx;if(!A||!SFX.on||!MUS.bus)return{stop(){}};const t=A.currentTime,o=A.createOscillator(),o2=A.createOscillator(),lfo=A.createOscillator(),lg=A.createGain(),g=A.createGain();
  o.type='triangle';o2.type='sine';o.frequency.value=midiF(m);o2.frequency.value=midiF(m)*2;lfo.frequency.value=5.5;lg.gain.value=4;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.26,t+.01);g.gain.linearRampToValueAtTime(.18,t+.3);o.connect(g);o2.connect(g);g.connect(MUS.bus);o.start(t);o2.start(t);lfo.start(t);
  return{stop(){const e=A.currentTime;g.gain.cancelScheduledValues(e);g.gain.setValueAtTime(g.gain.value,e);g.gain.exponentialRampToValueAtTime(.001,e+.25);for(const x of[o,o2,lfo])x.stop(e+.3)}}},
 tick(m){const A=SFX.ctx;if(!A||!SFX.on||!MUS.bus)return;osc('square',midiF(m),A.currentTime,.05,.08,MUS.bus,.001,.05)},

};
function noiseAt(t,d,v,freq,q,type){const a=SFX.ctx;if(!_nb){_nb=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=_nb.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=_nb;f.type=type;f.frequency.value=freq;f.Q.value=q;env(g,t,.001,v,d);s.connect(f);f.connect(g);g.connect(MUS.bus);s.start(t,Math.random()*.5);s.stop(t+d+.05)}

// ---------- 序列器：按 16 分音符预排 0.15 秒 ----------
function musSchedule(){const S=MUS.song,a=SFX.ctx,st=MUS.spb/4,ahead=a.currentTime+.15;
 while(MUS.start+MUS.nextStep*st<ahead){const i=MUS.nextStep++,t=MUS.start+i*st;if(t<a.currentTime-.05)continue;if(i>=S.steps)continue;if(SFX.on)playStep(S,i,t,st)}}
function playStep(S,i,t,st){const bar=i>>4,s=i&15,sec=S.secOf[bar];if(!sec)return;const ch=S.chords[bar%S.chords.length],root=S.root,boss=S.boss,lvl=sec.drums;
 // 鼓
 if(lvl>=1){if(s==0||s==8||(lvl>=2&&(s==10&&S.style!='four'))||(S.style=='four'&&s%4==0)||(boss&&s%4==0))INS.kick(t);
  if(lvl>=2&&(s==4||s==12))(S.style=='clap'?INS.clap:INS.snare)(t);
  if(lvl>=1&&s%2==0)INS.hat(t,s%4==2?1:.6,lvl>=3&&s%8==6);if(lvl>=3&&s%2==1)INS.hat(t,.4)}
 if(sec.fill&&bar==sec.endBar&&s>=8){INS.tom(t,[200,180,160,140,120,110,100,90][s-8]);if(s%2==0)INS.snare(t,.5)}
 if(s==0&&sec.crash&&bar==sec.startBar)INS.crash(t);
 // 低音：8 分音符跟和弦根音
 if(sec.bass&&s%2==0){const pat=S.bassPat[s>>1];if(pat)INS.bass(t,root-24+ch[0]+(pat==2?12:0),st*1.8)}
 // 铺底和弦：每小节一次
 if(sec.pad&&s==0)INS.pad(t,ch.map(n=>root-12+n),st*16);
 // 狂欢：琶音层

function updateFlow(dt){const L=G.lv;
 if(G.phase=='waves'){const w=L.waves[G.waveI];G.waveT+=dt;
  const hb=Math.floor(songBeat()*2);if(hb!=G.lastHB){G.lastHB=hb;while(G.spawnI<w.list.length&&w.list[G.spawnI].at/L.spd<=G.waveT){spawnFromList(w.list[G.spawnI]);G.spawnI++}}
  if(L.boss&&G.waveI==0&&!G.boss&&G.waveT>w.dur*.6)bossSpawn();
  const left=G.bugs.filter(b=>hostile(b)&&!b.boss).length;

   else if(G.mode=='endless'){G.endlessWave++;const nl=genEndless(G.endlessWave);L.waves=nl.waves;L.spd=nl.spd;G.waveI=0;G.waveT=0;G.spawnI=0;banner('第 '+(G.endlessWave+1)+' 波','',1.2);
    if(G.endlessWave%3==0)G.items.spray=Math.min(3,G.items.spray+1);if(G.endlessWave%5==0&&G.vegs.some(v=>v.hp>0&&v.hp<v.max)){const v=G.vegs.find(v=>v.hp>0&&v.hp<v.max);v.hp++;vegMoodAuto(v);floatText('+1♥',v.obj.position.x,1.3,VZ,'#ff8aa0',30)}}
   else{G.phase=L.rush?'rushIntro':'clear';G.phaseT=0;if(L.rush)banner('虫潮冲锋！','子弹无限，全力开火！',1.6)}}}
 else if(G.phase=='rushIntro'){G.phaseT+=dt;if(G.phaseT>1.3){G.phase='rush';G.phaseT=0;G.rushT=5;G.camGoal={pos:new V(0,12.8,10.4),at:new V(0,0,-2.4)};
   for(let r=0;r<4;r++)for(let i=0;i<7;i++){const b=makeBug('ant',-3+i+grnd()*.4,Z0-r*1.1);b.spd*=2.1;b.rush=1}}}
 else if(G.phase=='rush'){G.rushT-=dt;if(G.rushT<=0){G.phase='clear';G.camGoal=null}}

function endLevel(win){if(G.state!='play')return;G.state='over';setTimeout(()=>{if(G.state!='play')rhythmStop()},win?2200:900);G.qte=null;G.ts=1;G.camGoal=null;const L=G.lv,st=G.stats;
 const alive=aliveVegs().length,full=G.vegs.every(v=>v.hp==v.max);
 if(win){st.veg=alive*400;G.score+=st.veg;const acc=noteAcc();st.acc=acc;st.accPts=Math.round(acc*acc*acc*(noteHits()+(st.nm||0))*40/10)*10;G.score+=st.accPts}
 const r={win,score:G.score,alive,target:L.target,stars:0,grade:'C',best:0,newBest:false,mode:G.mode};
 if(G.mode=='endless'){r.time=G.t;r.best=SAVE.endless||0;if(G.score>r.best){SAVE.endless=G.score;r.newBest=true}if(G.t>=180)unlockAch('endless3');r.win=true}
 else if(win){r.stars=1+(alive==5?1:0)+(G.score>=L.target?1:0);const k=G.score/L.target,qOk=st.qmiss==0;
  r.grade=k>=1.3&&qOk&&!st.friend?'S+':k>=1.1&&qOk&&!st.friend?'S':k>=.9?'A':k>=.6?'B':'C';
  const order=['C','B','A','S','S+'],gi=order.indexOf(r.grade);if(gi<4){const need=[.6,.9,1.1,1.3][gi];r.next=order[gi+1];r.gap=Math.max(0,Math.ceil(L.target*need-G.score))}
  if(!st.friend)unlockAch('nolady');if(full)unlockAch('allveg');if(st.perfect>=3)unlockAch('perfect3');
  if(G.mode=='level'){const id=L.idx;r.best=SAVE.best[id]||0;if(G.score>r.best){SAVE.best[id]=G.score;r.newBest=r.best>0||true}SAVE.stars[id]=Math.max(SAVE.stars[id]||0,r.stars);
   if(id==7)unlockAch('boss1');if(id+1>SAVE.unlocked&&id+1<NLV)SAVE.unlocked=id+1;SAVE.cur=Math.min(NLV-1,id+1)}
 }
 if(G.mode=='daily'){const d=SAVE.daily;if(d.seed!=L.daily){d.seed=L.daily;d.best=0;d.tries=0}d.tries++;r.tries=d.tries;r.best=d.best;if(G.score>d.best){d.best=G.score;r.newBest=true}}
 if(G.mode=='level'&&!win)SAVE.cur=L.idx;
 G.result=r;G._first=win&&G.mode=='level'&&!(SAVE.cleared||{})[L.idx];if(win&&G.mode=='level'){SAVE.cleared=SAVE.cleared||{};SAVE.cleared[L.idx]=1}
 r.coins=coinReward(win);SAVE.coins+=r.coins;r.newPlants=syncPlants();
 save();G.result=r;G.resultT=0;win?SND.win():SND.lose()}
function restart(){if(G.mode=='daily')startLevel(genDaily(),'daily');else if(G.mode=='endless')startLevel(genEndless(0),'endless');else startLevel(genLevel(G.lv.idx),'level')}

 const o=inst(prefab('hen',()=>ITEM.hen()));o.scale.setScalar(1.8);o.rotation.y=Math.PI/2;DYN.add(o);G.hen={o,x:-5,z:bz};SND.pop()}

// ================= 虫子：生成、行为、受击 =================
const MODEL={ant:()=>BUG.ant(),antH:()=>BUG.ant({helmet:1}),fly:()=>BUG.fly(),aphid:()=>BUG.aphid(),lady:()=>BUG.ladybug(),beetle:()=>BUG.beetle(),snail:()=>BUG.snail(),
 locust:()=>BUG.locust(),spider:()=>BUG.spider(false),cater:()=>BUG.caterpillar(6),cater3:()=>BUG.caterpillar(3),bomber:()=>BUG.bomber(),mole:()=>BUG.mole(),firefly:()=>BUG.firefly(false),
 rhino:()=>BUG.rhino(),queen:()=>BUG.queen(),egg:()=>BUG.egg(),mantis:()=>BUG.mantis(),fqueen:()=>BUG.fqueen(),strider:()=>BUG.strider(),king:()=>BUG.king(),
 beetleF:()=>{const g=BUG.beetle();g.rotation.z=Math.PI;g.position.y=.42;const w=new THREE.Group();w.add(g);return w}};
const THREAD=new THREE.MeshBasicMaterial({color:'#f4f4ff'}),THREADG=new THREE.CylinderGeometry(.012,.012,1,4).translate(0,.5,0);
function bugObj(key,sc){const o=new THREE.Group(),m=inst(prefab(key,MODEL[key]),true);m.scale.setScalar(sc);o.add(m);o.userData.m=m;o.userData.wings=m.userData.wings;o.userData.u=m.userData.u;return o}
function makeBug(t,x,z){const def=BT[t];const o=bugObj(def.model,def.sc);o.position.set(x,0,z);DYN.add(o);
 const sh=blob(def.r*.9);o.add(sh);
 const b={t,def,x,z,o,sh,hp:def.hp,spd:def.spd*G.lv.spd*(.9+grnd()*.2),age:0,dead:false,state:'walk',tgt:null,wob:grnd()*6,vx:0,ph:0,y:0};
 b.tgt=pickVeg(x);
 if(t=='helm')b.armor=1;
 if(t=='fly'){b.y=.75;b.vx=(grnd()-.5)*2}
 if(t=='locust'){b.state='hop';b.ph=grnd()}
 if(t=='spider'){b.state='drop';const vt=b.tgt;b.x=vt.obj.position.x+(grnd()-.5)*.4;b.z=VZ-1.3-grnd()*.6;b.y=6;b.thread=new THREE.Mesh(THREADG,THREAD);b.thread.scale.y=6;DYN.add(b.thread);b.dropT=1.6}
 if(t=='mole'){const vt=b.tgt;b.x=clamp(vt.obj.position.x+(grnd()-.5)*1.6,-3,3);b.z=VZ-1.6-grnd()*1.8;b.state='under';b.ph=1+grnd();b.pops=3}
 if(t=='snail')b.trail=0;
 if(t=='rhino'){b.state='walk';b.chargeAt=3+grnd()*2;b.hp=8;b.z=Z0+1}
 if(t=='firefly'){b.y=.7;b.z=-5+grnd()*6;b.x=-2.5+grnd()*5;b.light=LIGHTS[1+(G.bugs.filter(q=>q.t=='firefly'&&!q.dead).length%2)]}
 if(t=='cater')b.len=6;
 if(t=='lady'){b.tgt=null;b.z=-6+grnd()*3}
 o.position.set(b.x,b.y,b.z);
 if(!SAVE.seen[t]&&!G.seenNew[t]&&!def.elite){G.seenNew[t]=1;b.newTip=4}
 G.bugs.push(b);return b}
function pickVeg(x){const al=aliveVegs();if(!al.length)return null;let best=al[0],bd=1e9;for(const v of al){const d=Math.abs(v.obj.position.x-x)+grnd()*1.2;if(d<bd){bd=d;best=v}}return best}
function makeBoss(key){const d=BOSS[key],o=bugObj(d.model,d.sc);o.position.set(0,0,Z0+.8);DYN.add(o);o.add(blob(d.r));
 const b={t:'boss',key,boss:1,def:Object.assign({r:d.r,y:d.y,pts:d.pts,splat:'#8adf50'},d),x:0,z:Z0+.8,o,hp:d.hp,max:d.hp,age:0,dead:false,state:'enter',st:0,y:0,wob:0,phase:1,
  atk:5,move:0,vx:1,guard:0,stopped:0};
 if(key=='fqueen'){b.y=1.2;b.light=LIGHTS[1]}
 G.bugs.push(b);return b}

// ---------- 受击 ----------
function killBug(b,how,silent){if(b.dead)return;b.dead=true;b.deadT=0;let d=b.def;
 if(d.friend&&how!='eaten'){friendHit(b);if(b.t=='firefly'&&b.light)b.light.intensity=0}
 else if(how!='eaten'&&how!='escape'){G.stats.kills++;addCombo();if(G.boss&&!G.boss.dead&&!b.boss&&G.lv.boss)d=Object.assign({},d,{pts:Math.round(d.pts*.2)});const k=rhythmHit(b.x,b.y,b.z,b.t=='rhino');if(k>1)G.stats.beatPts=(G.stats.beatPts||0)+Math.round(d.pts*(k-1)*mult()*(G.furyT>0?2:1));addScore(d.pts*k,b.x,b.y,b.z,k>=1.5?GOLD:k>1?'#7ee0ff':'#ffffff');SND.splat(G.combo);buzz(12);G.hitstop=.03;G.shake=Math.max(G.shake,.08)}
 if(how!='escape'){splatAt(b.x,b.z,d.splat);burst(b.x,b.y+.2,b.z,d.splat,8)}
 if(b.thread){DYN.remove(b.thread);b.thread=null}
 if(b.t=='bomber'&&how!='escape'){fartCloud(b.x,b.z)}
 if(b.webbing){b.webbing.webbed=false;b.webbing.web&&DYN.remove(b.webbing.web);b.webbing.web=null}
 if(b.t=='rhino'&&how!='escape'){G.items.frog=Math.min(3,G.items.frog+1);floatText('获得青蛙！',b.x,1.6,b.z,'#7ee06a',30)}
 if(b.newTip)SAVE.seen[b.t]=1;}
function bugHit(b,ges,info={}){if(b.dead)return false;const d=b.def,t=b.t;
 if(b.boss)return bossHit(b,ges,info);
 if(d.friend){if(ges=='tap'||ges=='swipe'||ges=='dbl'){killBug(b,'hit');return true}return false}
 if(G.furyT>0&&ges!='circle'&&!(t=='mole'&&b.state=='under')){if(t=='rhino'){b.hp-=2;hitFx(b);if(b.hp<=0)killBug(b,'hit');return true}killBug(b,'hit');return true}
 switch(t){
  case 'ant':case 'bomber':if(ges=='tap'||ges=='swipe'){killBug(b,'hit');return true}break;
  case 'helm':if(ges=='tap'||ges=='dbl'){if(b.armor){b.armor=0;b.armorT=.45;swapModel(b,'ant');SND.shell();burst(b.x,.5,b.z,'#8a5428',6);hint(b,'再点一下！');return true}killBug(b,'hit');return true}break;
  case 'fly':if(ges=='swipe'){killBug(b,'hit');return true}if(ges=='tap'){b.dodge=.4;b.vx=(b.x>0?-1:1)*4;hint(b,'要划过它');return true}break;
  case 'aphid':if(ges=='circle'){killBug(b,'hit');return true}if(ges=='tap'||ges=='swipe'){hint(b,'画个圈圈住');b.wob+=2}break;
  case 'beetle':if(b.state=='flip'&&(ges=='tap'||ges=='swipe')){killBug(b,'hit');return true}if(ges=='flip'){b.state='flip';b.flipT=3;swapModel(b,'beetleF');SND.shell();return true}
   if(ges=='tap'||ges=='swipe'){SND.shell();hint(b,'长按把它翻过来');return true}break;
  case 'snail':if(ges=='tap'||ges=='swipe'){hint(b,'按住拖出菜园');SND.shell()}break;
  case 'locust':if(ges=='tap'||ges=='swipe'){if(b.y<.25){killBug(b,'hit');return true}hint(b,'落地时再拍');return false}break;
  case 'spider':if(ges=='thread'){b.state='fall';b.thread&&DYN.remove(b.thread);b.thread=null;b.fallV=0;return true}
   if((ges=='tap'||ges=='swipe')&&b.state!='drop'&&b.state!='web'){killBug(b,'hit');return true}if(ges=='tap'&&b.state=='drop')hint(b,'划断它头上的丝');break;
  case 'cater':if(ges=='slice'){killBug(b,'hit');return true}if(ges=='tap'||ges=='swipe'){splitCater(b);return true}break;
  case 'mole':if((ges=='tap'||ges=='swipe')&&b.state=='up'){killBug(b,'hit');return true}break;
  case 'rhino':if(ges=='tap'||ges=='swipe'){if(b.state=='charge')return false;b.hp--;hitFx(b);G.shake=.06;if(b.hp<=0)killBug(b,'hit');else SND.hit();return true}break;
  case 'egg':if(ges=='tap'||ges=='swipe'){killBug(b,'hit');return true}break;
 }return false}
function hitFx(b){burst(b.x,.5,b.z,'#ffffff',5);b.flash=.12;SND.hit()}
function swapModel(b,key){b.o.remove(b.o.userData.m);const m=inst(prefab(key,MODEL[key]),true);m.scale.setScalar(b.def.sc);b.o.add(m);b.o.userData.m=m;b.o.userData.wings=m.userData.wings;b.o.userData.u=m.userData.u}
function splitCater(b){const x=b.x,z=b.z;killBug(b,'escape');SND.hit();floatText('断成两截了！',x,1,z,'#ffd23f',26);
 for(const dx of[-.5,.5]){const n=makeBug('cater',x+dx,z-.2);n.len=3;swapModel(n,'cater3');n.spd*=1.25;n.short=1}}
function hint(b,s){if(b.hintT>0)return;b.hintT=1.4;floatText(s,b.x,1.3,b.z,'#ffffff',26)}

// ---------- 每帧行为 ----------
function updateBugs(dt){const L=G.lv;G.stepK=1+.6*Math.cos(songBeat()*Math.PI*4);
 if(G.lv.wind){G.nextGust-=dt;if(G.nextGust<0&&G.gust<=0){G.gust=2.5;G.gustDir=grnd()<.5?-1:1;G.nextGust=13+grnd()*5;banner('起风了','',.8,true)}if(G.gust>0)G.gust-=dt}
 for(const b of G.bugs){if(b.dead){b.deadT+=dt;continue}b.age+=dt;if(b.hintT>0)b.hintT-=dt;if(b.newTip>0&&(!G.tipBug||G.tipBug.dead||G.tipBug.newTip<=0)&&b.z>-6.6)G.tipBug=b;if(b===G.tipBug)b.newTip-=dt;if(b.flash>0)b.flash-=dt;
  if(b.boss){updateBoss(b,dt);continue}
  const d=b.def,t=b.t;let sp=b.spd*(d.air?1:G.stepK);
  // 黏液：经过蜗牛的痕迹会加速
  for(const s of G.slime)if(Math.abs(b.x-s.x)<.35&&b.z>s.z0&&b.z<s.z1&&t!='snail'){sp*=1.6;break}
  if(b.armorT>0)b.armorT-=dt;
  if(b.tgt&&b.tgt.hp<=0)b.tgt=pickVeg(b.x);
  const tx=b.tgt?b.tgt.obj.position.x:b.x;
  if(t=='lady'){// 瓢虫：找最近的蚜虫吃
   let best=null,bd=1e9;for(const q of G.bugs)if(q.t=='aphid'&&!q.dead){const dd=Math.hypot(q.x-b.x,q.z-b.z);if(dd<bd){bd=dd;best=q}}
   if(best){const a=Math.atan2(best.x-b.x,best.z-b.z);b.x+=Math.sin(a)*sp*1.3*dt;b.z+=Math.cos(a)*sp*1.3*dt;b.o.rotation.y=a;if(bd<.5){killBug(best,'eaten');floatText('瓢虫吃掉了蚜虫',best.x,1,best.z,'#7ee06a',24);G.score+=20}}
   else{b.wob+=dt;b.x+=Math.sin(b.wob*.8)*dt*.8;b.z+=dt*.15;b.o.rotation.y=Math.sin(b.wob*.8)*.6}
   if(b.z>VZ-1.2||b.age>26){killBug(b,'escape')}b.x=clamp(b.x,-3.3,3.3);place(b);continue}
  if(t=='firefly'){b.wob+=dt;b.x+=Math.sin(b.wob*.7)*dt*.9;b.z+=Math.cos(b.wob*.5)*dt*.6;b.x=clamp(b.x,-3,3);b.z=clamp(b.z,-6,2.5);b.y=.7+Math.sin(b.wob*2)*.15;
   if(b.light){b.light.position.set(b.x,b.y+.2,b.z);b.light.intensity=7}b.o.rotation.y=Math.sin(b.wob*.7)*.8;if(b.age>40)killBug(b,'escape');place(b);continue}
  if(t=='mole'){b.ph-=dt;if(b.state=='under'){b.y=-.5;if(b.ph<0){b.state='up';b.ph=.8/Math.min(1.4,L.spd)+.15;SND.pop()}}
   else{b.y=-.05;if(b.ph<0){b.pops--;if(b.pops<=0){const v=nearestVeg(b.x);if(v&&Math.abs(v.obj.position.x-b.x)<1.4)damageVeg(v,1);killBug(b,'escape')}else{b.state='under';b.ph=.9+grnd()*.8;
     b.x=clamp(b.tgt?b.tgt.obj.position.x+(grnd()-.5)*1.8:b.x,-3,3);b.z=VZ-1.4-grnd()*2}}}
   b.o.position.set(b.x,b.y,b.z);b.o.visible=b.state=='up'||b.ph<.2;continue}
  if(t=='spider'){if(b.state=='drop'){b.dropT-=dt*L.spd;b.y=Math.max(.42,b.y-dt*3.5);if(b.thread){b.thread.position.set(b.x,b.y+.5,b.z-.1);b.thread.scale.y=9-b.y}

// 时间放慢到 ×0.2，镜头推近；QTE 计时用真实时间
function qteBegin(q,cam){G.qte=q;G.ts=.2;G.camGoal=cam;G.qteCount++;SND.slow();buzz(40)}

 else if(res=='good'){st.good++;SND.good();G.score+=800;st.qte+=800;floatScreen('GOOD  +800',360,420,'#7ee06a',48)}
 else{st.qmiss++;SND.miss();floatScreen('MISS',360,420,'#ff6a5a',54);breakCombo()}}

function startChargeQTE(b,boss){const tgt=boss?gpick(aliveVegs()):b.tgt;if(!tgt)return;b.state='charge';b.chargeV=tgt;

function genBar(bar){const al=aliveVegs().map(v=>v.i);if(!al.length)return;gseed(G.lv.idx*7919+bar*131+(G.mode=='endless'?G.endlessWave*17:0));
 const L=G.lv,sec=RH.secI|0,lvl=Math.min(1,L.s*.18+L.l*.05),easy=L.idx==0&&G.mode=='level'&&bar<8;
 const pOn=easy?[.9,0,.5,0,.9,0,.5,0]:[1,0,.8,0,.95,0,.8,0],pOff=easy?0:[.08,.25,.45][sec]+lvl*.3,pDbl=easy?0:[0,.08,.2][sec]+lvl*.15;
 let last=-1;for(let k=0;k<8;k++){const p=k%2?pOff:pOn[k]*(sec==0&&!easy?.85+lvl*.15:1);if(grnd()>=p)continue;
  const m=RH.mel[(bar*8+k)%RH.mel.length];let i=al[((m%12)*3+k)%al.length];if(i==last&&al.length>1&&k%2)i=al[(al.indexOf(i)+1)%al.length];last=i;
  const beat=bar*4+k/2;DRUM.notes.push({i,beat});
  if(grnd()<pDbl&&al.length>2){const j=al[(al.indexOf(i)+2)%al.length];DRUM.notes.push({i:j,beat})}}}
function noteTick(){if(G.state!='play'||!RH.on)return;const sb=songBeat();
 while(DRUM.genBar*4<sb+LEAD+4){if(!G.qte)genBar(DRUM.genBar);DRUM.genBar++}
 for(const n of DRUM.notes){if(n.done)continue;const v=G.vegs[n.i];if(v.hp<=0||G.qte){n.done=1;continue}
  if(sb-n.beat>.5){n.done=1;noteMiss(v)}}
 DRUM.notes=DRUM.notes.filter(n=>!n.done)}

 let bi=-1,bd=1e9;for(const v of G.vegs){const sx=worldToScreen(v.obj.position.x,.5,VZ)[0],d=Math.abs(sx-x);if(d<bd){bd=d;bi=v.i}}return bd<110?bi:-1}

function drumHit(i,t){const v=G.vegs[i];if(!v||v.hp<=0||G.state!='play'||G.qte)return null;t=t??songTime();const tb=t/RH.spb;
 let best=null,bd=1e9;for(const n of DRUM.notes)if(!n.done&&n.i==i){const d=Math.abs(tb-n.beat);if(d<bd){bd=d;best=n}}

 best.done=1;const ms=bd*RH.spb,ji=ms<=DRUM.win.perfect?0:ms<=DRUM.win.great?1:ms<=DRUM.win.good?2:3,[j,label,col,pts0]=JUDGE[ji],S=v.stat;

 if(ji<3)DRUM.combo++;else DRUM.combo=0;
 const n=(ji==3&&(G.stats.j_off&1)?0:S.ammo[ji])+(ji<3&&DRUM.combo%10==0?2:0);
 if(ji==0){RH.streak++;G.stats.beat=(G.stats.beat||0)+1;RH.meter=Math.min(1,RH.meter+.025);if(++v.charge>=5){v.charge=0;v.sup++;floatText('强化弹！',v.obj.position.x,2.2,VZ,'#ffffff',26)}}else if(ji==3)RH.streak=0;

 v.flash={c:col,t:.25};drumSound(v,ji);floatText(label+(got?' +'+got:' 满'),v.obj.position.x,1.7,VZ,col,ji==0?28:24);return j}

const PREFER={tomato:['aphid','snail'],pumpkin:['helm','beetle','rhino'],carrot:['cater'],eggplant:['fly','locust','spider'],corn:['fly','locust','spider'],onion:['snail','rhino'],chili:['aphid','cater']};
function pickTarget(v){const S=v.stat,vx=v.obj.position.x,pr=PREFER[v.k]||[];let best=null,bs=-1e9;
 for(const b of G.bugs){if(!canHit(b,S))continue;const d=Math.hypot(b.x-vx,b.z-VZ);if(d>S.range&&!b.boss)continue;
  let sc=b.z*2-Math.abs(b.x-vx)*.8+(pr.includes(b.t)?6:0)+(b.boss?-2:0);if(b.t=='beetle'&&b.state!='flip'&&!S.heavy)sc-=3;
  if(isAir(b)&&S.air)sc+=4;if(sc>bs){bs=sc;best=b}}return best}
function autoFire(dt){if(G.state!='play'||G.qte)return;const free=freeFire();
 for(const v of G.vegs){if(v.hp<=0)continue;v.cd-=dt*(G.furyT>0?1.6:1);if(v.cd>0||(!free&&v.ammo<=0))continue;const b=pickTarget(v);if(!b){v.cd=.08;continue}
  const sup=!free&&v.sup>0;if(!free)v.ammo--;if(sup)v.sup--;v.cd=v.stat.rate;G.stats.shots=(G.stats.shots||0)+1;v.pulse=Math.max(v.pulse,.5);fire(v,b,sup)}}
const SHOTG=new THREE.SphereGeometry(.12,10,8);
function fire(v,b,sup){const W=v.stat,vx=v.obj.position.x,dm=(G.furyT>0?2:1)*(sup?2:1);if(sup)floatText(W.weap+'！',vx,2,VZ,W.col,30);
 if(W.chain){const ts=[b],pool=G.bugs.filter(q=>q!==b&&canHit(q,W));let p=b;
  for(let k=0;k<(sup?6:W.chain);k++){let n=null,nd=2.2;for(const q of pool)if(!ts.includes(q)){const d=Math.hypot(q.x-p.x,q.z-p.z);if(d<nd){nd=d;n=q}}if(!n)break;ts.push(n);p=n}
  const pts=[worldToScreen(vx,.8,VZ)];for(const q of ts){pts.push(worldToScreen(q.x,q.y+q.def.y*.6,q.z));drumDmg(q,W,dm)}DRUM.bolts.push({pts,t:.18,c:W.col});return}
 const o=new THREE.Mesh(SHOTG,pmat(W.col));o.scale.setScalar(sup?2.2:W.heavy?1.8:W.arc?1.6:W.k=='pea'?.8:1.1);o.position.set(vx,.6,VZ-.3);DYN.add(o);
 const d=Math.hypot(b.x-vx,b.z-VZ)/W.spd;DRUM.shots.push({o,W,dm,b,x0:vx,z0:VZ-.3,tx:b.x,tz:b.z,t:0,d:Math.max(.06,d),sup,v})}
// 命中：按武器的范围找出所有受击者
function impact(s){const W=s.W,b=s.b,x=s.o.position.x,z=s.o.position.z,near=(R,n)=>G.bugs.filter(q=>canHit(q,W)&&Math.hypot(q.x-x,q.z-z)<R+q.def.r*.5).sort((p,q)=>Math.hypot(p.x-x,p.z-z)-Math.hypot(q.x-x,q.z-z)).slice(0,n);
 let hits=b&&!b.dead&&canHit(b,W)?[b]:[];
 if(W.pierce){const dx=x-s.x0,dz=z-s.z0,L=Math.hypot(dx,dz)||1,ux=dx/L,uz=dz/L;
  const line=G.bugs.filter(q=>canHit(q,W)&&q!==b).map(q=>{const t=(q.x-s.x0)*ux+(q.z-s.z0)*uz,px=s.x0+ux*t,pz=s.z0+uz*t;return[q,t,Math.hypot(q.x-px,q.z-pz)]}).filter(a=>a[1]>L-1.2&&a[1]<L+(s.sup?20:3.5)&&a[2]<.5+a[0].def.r*.4).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
  hits=hits.concat(line).slice(0,s.sup?99:W.pierce)}
 else if(W.area){hits=near(s.sup?W.area*2.4:W.area,s.sup?99:W.max);for(let k=-2;k<=2;k++)puff(x+k*.3,.15,z,W.burn?'#ffb060':'#c8ffa0')}
 else if(W.splash){hits=near(W.splash*(s.sup?2:1),99);burst(x,.3,z,W.col,12)}
 else if(W.heavy&&s.sup)hits=near(1.6,99);
 for(const q of hits){drumDmg(q,W,s.dm);if(W.knock&&!q.dead&&!q.boss)q.z-=W.knock;if(W.slow&&!q.dead)q.slowT=3;if(W.burn&&!q.dead)q.burnT=2}
 if(W.k=='cabbage'&&s.sup){const w=aliveVegs().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(w&&w.hp<w.max){w.hp++;vegMoodAuto(w);floatText('+1♥',w.obj.position.x,1.3,VZ,'#ff8aa0',30)}}

  case 'beetle':if(b.state!='flip'){b.knock=(b.knock||0)+(heavy?2:1);if(b.knock>=2){b.knock=0;bugHit(b,'flip')}else SND.shell();return}killBug(b,'hit');return;

  G.fx.push({o,vx:Math.cos(a)*s,vy:2+Math.random()*3,vz:Math.sin(a)*s*.7,t:0,d:.6+Math.random()*.3})}}
function puff(x,y,z,c){const o=new THREE.Mesh(FX.pGeo,new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.8}));o.position.set(x,y,z);o.scale.setScalar(2.5);DYN.add(o);G.fx.push({o,vx:0,vy:.8,vz:0,t:0,d:.5,grow:1})}
function splatAt(x,z,c){const o=inst(splatParts(c));o.position.set(x,0,z);o.rotation.y=Math.random()*6;o.scale.setScalar(.9+Math.random()*.4);DYN.add(o);G.fx.push({o,t:0,d:4,splat:1});
 const n=G.fx.filter(f=>f.splat).length;if(n>24){const f=G.fx.find(f=>f.splat);f.t=f.d}}
function ringFx(pts){for(let i=0;i<pts.length;i+=3){const g=screenToGround(...pts[i]);if(g)puff(g.x,.1,g.z,'#ffffff')}}
function updateFx(dt){for(const f of G.fx){f.t+=dt;const o=f.o;if(f.splat){if(f.t>f.d-1)o.scale.y=Math.max(.01,(f.d-f.t));continue}
  if(f.grow){o.scale.setScalar(2.5+f.t*4);o.material.opacity=.8*(1-f.t/f.d);o.position.y+=f.vy*dt;continue}
  f.vy-=12*dt;o.position.x+=f.vx*dt;o.position.y=Math.max(.03,o.position.y+f.vy*dt);o.position.z+=f.vz*dt;o.scale.setScalar(1-f.t/f.d)}
 G.fx=G.fx.filter(f=>{if(f.t>=f.d){DYN.remove(f.o);if(f.grow)f.o.material.dispose();return false}return true});
 for(const k of G.clouds)k.t-=dt;G.clouds=G.clouds.filter(k=>k.t>0)}

// ---------- 场景机制：雨、孢子、夜晚手电筒 ----------
function updateMech(dt){const L=G.lv;
 if(L.rain){G.nextRain-=dt;if(G.nextRain<0){G.nextRain=5+grnd()*4;const x=-3+grnd()*6,z=-5+grnd()*6;for(let i=0;i<8;i++)puff(x+(grnd()-.5)*1.2,.1,z+(grnd()-.5)*1.2,'#bfe6ff');
   for(const b of G.bugs)if(!b.dead&&!b.boss&&Math.hypot(b.x-x,b.z-z)<1.6&&b.t!='mole'){b.x+=Math.sign(b.x-x||1)*1.2;b.z-=.8}floatText('雨滴！虫子被冲散',x,1,z,'#bfe6ff',24)}}
 if(L.spores){G.nextSpore-=dt;if(G.nextSpore<0&&!G.spore){G.nextSpore=12+grnd()*5;G.spore={x:-2+grnd()*4,z:-4+grnd()*4,t:5}}
  if(G.spore){G.spore.t-=dt;if(G.spore.t<0)G.spore=null}}
 // 夜晚：手指按住处就是手电筒
 if(NIGHT){const L0=LIGHTS[0];let lit=false;for(const t of TOUCH.values()){const g=screenToGround(t.x,t.y);if(g){L0.position.set(g.x,1.8,g.z);lit=true;break}}
  L0.intensity=lerp(L0.intensity,lit?32:(G.lastTorch?14:0),.2);if(lit)G.lastTorch=1;
  W.hemi.intensity=G.dark>0?.04:THEME.night.hemi[2]}}
// 孢子区域：手势反转——区域内划动当点击、点击当划动（在 input 前处理）
const _bugHit=bugHit;
bugHit=function(b,ges,info){if(G.spore&&!b.boss&&Math.hypot(b.x-G.spore.x,b.z-G.spore.z)<1.5){if(ges=='tap')ges='swipe';else if(ges=='swipe')ges='tap'}return _bugHit(b,ges,info)};

// ---------- 道具：青蛙、母鸡 ----------
function updateItems(dt){const F=G.frog;if(F){F.t-=dt;F.lick-=dt;if(!F.tgt||F.tgt.dead){let best=null,bd=1e9;for(const b of G.bugs)if(hostile(b)&&!b.boss&&b.t!='mole'){const d=Math.hypot(b.x-F.x,b.z-F.z);if(d<bd){bd=d;best=b}}F.tgt=best}
  if(F.tgt){const b=F.tgt,d=Math.hypot(b.x-F.x,b.z-F.z);if(d>1.2){F.x+=(b.x-F.x)/d*dt*3;F.z+=(b.z-F.z)/d*dt*3;F.o.position.y=Math.abs(Math.sin(G.t*9))*.3}else if(F.lick<0){F.lick=.35;killBug(b,'hit');F.tgt=null}F.o.rotation.y=Math.atan2(b.x-F.x,b.z-F.z)}
  F.o.position.x=F.x;F.o.position.z=F.z;if(F.t<0){DYN.remove(F.o);G.frog=null}}
 const Hn=G.hen;if(Hn){Hn.x+=dt*7;Hn.o.position.set(Hn.x,Math.abs(Math.sin(G.t*14))*.15,Hn.z);for(const b of G.bugs)if(hostile(b)&&!b.boss&&Math.abs(b.z-Hn.z)<1&&Math.abs(b.x-Hn.x)<.6)killBug(b,'hit');if(Hn.x>5){DYN.remove(Hn.o);G.hen=null}}}

// ---------- 镜头 ----------
const _cp=new V(),_ca=new V(),CAMCUR={pos:CAMHOME.pos.clone(),at:CAMHOME.at.clone()};
function updateCam(rdt){const g=G.camGoal||CAMHOME,k=1-Math.pow(.02,rdt);CAMCUR.pos.lerp(g.pos,k);CAMCUR.at.lerp(g.at,k);
 _cp.copy(CAMCUR.pos);if(RH.on&&G.state=='play'){const bp=((songBeat()%1)+1)%1;_cp.y-=(bp<.1?(1-bp/.1):0)*.05*(G.furyT>0?2:1)}if(G.shake>0){G.shake-=rdt;const s=G.shake*.25;_cp.x+=(Math.random()-.5)*s;_cp.y+=(Math.random()-.5)*s}CAM.position.copy(_cp);CAM.lookAt(CAMCUR.at)}

// ---------- 画质 ----------
function setQuality(q,manual){if(q==QUALITY&&W)return;QUALITY=q;if(manual){SAVE.quality=q;save()}for(const k in PREFAB)delete PREFAB[k];for(const k in _down)delete _down[k];_vcm=null;for(const k in FX.splat)delete FX.splat[k];
 R3.shadowMap.enabled=q<2;applySize();if(G.state=='play'||G.state=='over'){const keep=G.lv,mode=G.mode;W=null;startLevel(keep,mode)}}
const PERF={t:0,n:0,done:false,lowT:0};
function perfCheck(rdt){if(SAVE.quality>=0||PERF.done)return;PERF.t+=rdt;PERF.n++;if(PERF.t>=3){const fps=PERF.n/PERF.t;PERF.t=0;PERF.n=0;
 if(fps<40&&QUALITY<2){if(DPR>1.5){DPR=Math.max(1.5,DPR-.5);applySize()}else setQuality(QUALITY+1)}else if(fps>=52)PERF.lowT++;if(PERF.lowT>=2)PERF.done=true}}

// ---------- 尺寸 ----------
let DPR=Math.min(2,window.devicePixelRatio||1);
function applySize(){const w=window.innerWidth,h=window.innerHeight;let cw=w,ch=h;if(w/h>.75){cw=Math.round(h*.5625)}// 桌面横屏：居中显示竖屏画面
 const left=Math.round((w-cw)/2)+'px';for(const c of[CV,UC]){c.style.width=cw+'px';c.style.height=ch+'px';c.style.left=left}
 const r=QUALITY==2?Math.min(DPR,1.25):DPR;R3.setPixelRatio(r);R3.setSize(cw,ch,false);UI.k=cw/720;UI.w=720;UI.h=Math.round(ch/UI.k);
 UC.width=Math.round(cw*Math.min(2,window.devicePixelRatio||1));UC.height=Math.round(ch*Math.min(2,window.devicePixelRatio||1));fitCam(cw/ch,UI.h);if(typeof CAMCUR!='undefined'&&!G.camGoal){CAMCUR.pos.copy(CAMHOME.pos);CAMCUR.at.copy(CAMHOME.at)}R3.shadowMap.needsUpdate=true}
window.addEventListener('resize',applySize);window.addEventListener('orientationchange',()=>setTimeout(applySize,200));

// ---------- 选关页滚动 ----------
let _mapDrag=null;
const _onDown=onDown,_onMove=onMove,_onUp=onUp;
onDown=function(id,x,y){if(G.state=='map'||G.state=='garden'){audioUnlock();_mapDrag={id,y0:y,s0:MAPSCROLL,moved:0,x,y};return}_onDown(id,x,y)};
onMove=function(id,x,y){if(G.state=='garden'&&_mapDrag&&_mapDrag.id==id){_mapDrag.moved=Math.max(_mapDrag.moved,Math.abs(y-_mapDrag.y0));if(_mapDrag.y0>372){if(_mapDrag.g0==null)_mapDrag.g0=GSCROLL;GSCROLL=clamp(_mapDrag.g0-(y-_mapDrag.y0),0,gardenMaxScroll())}return}
 if(G.state=='map'&&_mapDrag&&_mapDrag.id==id){_mapDrag.moved=Math.max(_mapDrag.moved,Math.abs(y-_mapDrag.y0));MAPSCROLL=clamp(_mapDrag.s0-(y-_mapDrag.y0),0,5*330-(UI.h-300));return}_onMove(id,x,y)};
onUp=function(id,x,y){if((G.state=='map'||G.state=='garden')&&_mapDrag){const d=_mapDrag;_mapDrag=null;if(d.moved<14)uiTap(x,y);return}_onUp(id,x,y)};

// ---------- 主循环 ----------
let _last=performance.now();
function frame(now){requestAnimationFrame(frame);let rdt=Math.min(.05,(now-_last)/1000);_last=now;
 const c=CX;c.setTransform(UC.width/720,0,0,UC.width/720,0,0);c.clearRect(0,0,720,UI.h);UI.btns.length=0;
 if(G.state=='map'){drawMap(c);return}
 if(G.state=='garden'){drawGarden(c);return}
 if(!W)return;
 const run=G.state=='play'&&!G.paused;
 if(run){if(G.hitstop>0){G.hitstop-=rdt}else{const dt=rdt*G.ts;G.t+=rdt;
   if(G.furyT>0)G.furyT-=rdt;if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0&&G.combo>0){if(G.combo>=10)floatScreen('连击结束 '+G.combo,360,300,'#ffb04a',28);G.combo=0}}
   rhythmSection();updateFlow(dt);updateBugs(dt);drumTick(rdt,dt);updateHolds(rdt);updateQTE(rdt);updateItems(dt);updateMech(dt);
   if(G.mode=='endless'&&G.state=='play'){}}}
 if(!G.paused)rhythmTick(rdt);updateFx(run?rdt*G.ts:rdt*.3);updateCam(rdt);
 if(run||G.state=='over')for(const b of G.bugs)if(b.o.userData.wings)for(const w of b.o.userData.wings)w.visible=(now/16|0)%2==0;
 if((now/500|0)!=G._shT){G._shT=now/500|0;R3.shadowMap.needsUpdate=true}// 阴影每 0.5 秒刷新一次（虫子用假阴影）
 R3.render(W.sc,CAM);perfCheck(rdt);
 if(G.spore){const p=worldToScreen(G.spore.x,0,G.spore.z),e=worldToScreen(G.spore.x+1.5,0,G.spore.z),r=Math.abs(e[0]-p[0]);c.fillStyle=`rgba(200,140,255,${.22+Math.sin(G.t*6)*.06})`;c.beginPath();c.ellipse(p[0],p[1],r,r*.7,0,0,7);c.fill();T(c,'孢子：里面的虫子打不到',p[0],p[1],22,'#fff')}
 if(G.dark>0){c.fillStyle='rgba(0,0,10,.55)';c.fillRect(0,0,720,UI.h)}
 drawBeatFloor(c);drawDrums(c);drawWorldUI(c);drawHUD(c);drawBeatHUD(c);drawQTE(c);drawFloats(c,rdt);
 if(G.state=='over'&&G.result)drawResult(c,rdt);
 if(G.paused)drawPause(c)}

// ---------- 启动：直接开局，无封面 ----------
SFX.on=SAVE.sound!==false;
if(SAVE.quality>=0)QUALITY=SAVE.quality;else if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&(navigator.hardwareConcurrency||8)<=4)QUALITY=1;
R3.shadowMap.enabled=QUALITY<2;applySize();
syncPlants();playLevel(Math.min(SAVE.cur,SAVE.unlocked));
window.GAME=G;window.DONE=true;
requestAnimationFrame(frame);

</script></body></html>
